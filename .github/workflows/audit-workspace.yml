name: Isolated audit workspace
on:
  push:
    branches: [Chat-GPT]
    paths: ['.github/workflows/audit-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package existing catalogue and narration fixtures
        run: |
          mkdir -p audit-workspace
          tar -czf audit-workspace/audit-fixtures.tar.gz intervention-library narration-manifest.json
      - uses: actions/upload-artifact@v5
        with:
          name: isolated-audit-fixtures
          path: audit-workspace/
          retention-days: 1
