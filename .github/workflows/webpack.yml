name: Release checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/verify-v3-algorithm.mjs
      - run: npm run build
      - run: node scripts/verify-engineering-release.mjs
      - run: npm audit --audit-level=high
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --package-lock=false playwright@1.63.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Check Home in Chromium and WebKit
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright/index.mjs
          SMOKE_BROWSERS: chromium,webkit
        run: node scripts/engineering-smoke.browser.mjs
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - run: node scripts/verify-engineering-release.mjs
      - run: git diff --exit-code -- ios/App/CapApp-SPM/Package.swift
      - name: Build unsigned iOS simulator candidate
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/App/App.xcodeproj
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/MenticationBuild" CODE_SIGNING_ALLOWED=NO build
