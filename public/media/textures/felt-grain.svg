<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="felt" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="4" seed="17" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feGaussianBlur stdDeviation="0.18"/>
  </filter>
  <rect width="180" height="180" fill="#808080" filter="url(#felt)" opacity="0.32"/>
</svg>
