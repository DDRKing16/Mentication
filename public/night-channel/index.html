<style>/* Keep the supplied violet artwork and orb, but let content breathe and scroll. */
@font-face{font-family:Caveat;font-style:normal;font-weight:500;src:url('/fonts/dear2100/caveat/caveat-latin-500-normal.woff2') format('woff2');font-display:swap}
@font-face{font-family:Caveat;font-style:normal;font-weight:600;src:url('/fonts/dear2100/caveat/caveat-latin-600-normal.woff2') format('woff2');font-display:swap}
@font-face{font-family:Caveat;font-style:normal;font-weight:700;src:url('/fonts/dear2100/caveat/caveat-latin-700-normal.woff2') format('woff2');font-display:swap}
#root {color:#eee6ff;font-family:Quicksand,system-ui,sans-serif}
#root > div {height:auto;min-height:100dvh;max-height:none;overflow:visible}
#root > div > div.relative {height:auto;min-height:100dvh;max-height:none;padding:24px 16px;gap:24px;max-width:480px}
#root .overflow-hidden:not(.fixed):not(.absolute):not(.pointer-events-none) {overflow:visible}
#root .min-h-0 {min-height:auto}
#root .justify-evenly {justify-content:flex-start;gap:24px}
#root button,#root select,#root input[type=range],#root label[title] {min-height:44px}
#root button:disabled {opacity:.5;cursor:not-allowed}
#root button:focus-visible,#root input:focus-visible,#root select:focus-visible {outline:3px solid #eee6ff;outline-offset:3px}
#root [class*="text-[9"],#root [class*="text-[10"],#root [class*="text-[11"],#root [class*="text-[12"] {font-size:14px;line-height:1.45}
#root [class*="text-[#8E7EBE]"] {color:#c7b9e5}
#root .whitespace-nowrap {white-space:normal}
#root .line-clamp-2 {display:block;-webkit-line-clamp:unset}
#root button.group {height:auto!important;min-height:220px!important}
#root [style*="height: 33px"] {height:auto!important;min-height:44px!important}
#root .fixed > div:last-child {overflow:auto}
#root .fixed label[title],#root .fixed button[class*="w-9"],#root .fixed button[class*="w-8"] {min-width:44px}
#root .fixed .group {flex-wrap:wrap;gap:16px}
#root .fixed .group > button {min-width:200px}
#root .fixed input[type=file] {display:block;width:44px;opacity:.01;position:absolute}
.night-controls {font-size:14px;line-height:1.5;background:#291c45;border:1px solid #756393;border-radius:20px;padding:18px}
.night-controls p {margin:8px 0 14px}
.night-actions,.night-ratings {display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.night-controls button,.night-provider button {background:#ded0f8;color:#27173f;border:1px solid #b9a0df;border-radius:12px;padding:10px 14px;min-height:44px}
.night-controls select,.night-controls input {display:block;width:100%;background:#3a2a58;color:#fff;border:1px solid #b9a0df;border-radius:8px;padding:10px;margin:8px 0;font-size:16px}
.night-provider {border:1px solid #9881ba;border-radius:16px;padding:16px;margin:12px 0;line-height:1.5}
.night-provider h2 {font-size:21px;margin-bottom:10px}
.night-practice-guide,.night-setup-note{margin:14px 0;border-top:1px solid #756393;padding-top:8px}
.night-practice-guide summary,.night-setup-note summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:#eee6ff}
.night-setup-note a{display:inline-flex;min-height:44px;align-items:center;color:#eee6ff;text-decoration:underline}
.night-controls details p{overflow-wrap:anywhere}
.night-modal{margin:0;padding:0;border:0;background:transparent;color:inherit;width:100vw;max-width:none;max-height:100dvh;height:100dvh}
.night-modal::backdrop{background:rgba(29,19,51,.75)}
.large-text #root .night-controls{font-size:18px;line-height:1.6}
.large-text #root [class*="text-[9"],.large-text #root [class*="text-[10"],.large-text #root [class*="text-[11"],.large-text #root [class*="text-[12"],.large-text #root [class*="text-[13"],.large-text #root [class*="text-[14"]{font-size:18px;line-height:1.5}
.high-contrast #root [class*="text-[#8E7EBE]"]{color:#eee6ff}
.reduce-motion #root *,.reduce-motion #root *:before,.reduce-motion #root *:after{animation:none!important;transition:none!important}
.night-ratings button {min-width:44px}
@media(prefers-reduced-motion:reduce) {#root *,#root *:before,#root *:after {animation:none!important;transition:none!important}}
#root .shrink-0 {max-width:100%;min-width:0}
#root .whitespace-nowrap {white-space:normal!important}
#root .h-\[70px\] {height:auto;min-height:70px}
#root h1 {font-size:clamp(42px,12vw,64px);white-space:nowrap}
.night-stop {background:#eadcff;color:#27173f;border:2px solid #fff;border-radius:12px;padding:10px 16px;font-weight:700}
#root label:focus-within {outline:3px solid #eee6ff;outline-offset:3px}
.night-setup-flow h2,.night-provider-flow h2,.night-check h2{font-size:clamp(28px,8vw,36px);font-weight:700;line-height:1.15;letter-spacing:-.02em;margin:0 0 16px;color:#f3efff}
.night-setup-flow>p{font-size:16px;line-height:1.5;margin:0 0 22px;color:#d8ccff}
.night-sound-choices,.night-timer-choices{display:grid;gap:10px}
.night-setup-flow button{width:100%;background:#3a2c65;color:#f3efff;border:1px solid #9985bc;border-radius:16px;padding:16px;text-align:left;font-size:17px}
.night-sound-choices strong,.night-sound-choices span{display:block}
.night-sound-choices span{font-size:14px;color:#d8ccff;margin-top:4px}
.night-timer-choices button[aria-pressed=true]{background:#eee6ff;color:#27173f;border:2px solid #eee6ff}
#root .night-primary{display:block;width:100%;min-height:56px;margin-top:22px;background:#eee6ff;color:#27173f;font-size:18px;font-weight:700;text-align:center;border-radius:18px;padding:14px}
#root .night-quiet{background:transparent;color:#d8ccff;border:0;font-size:16px;text-decoration:underline;text-underline-offset:4px;margin-top:12px}
.night-other-sources,.night-playback-settings{margin-top:18px;font-size:16px}
.night-other-sources summary,.night-playback-settings summary{min-height:44px;display:flex;align-items:center;cursor:pointer}
.night-file-action{display:block;background:#eee6ff;color:#27173f;border-radius:18px;padding:18px;font-size:18px;font-weight:700}
.night-file-action input{display:block;width:100%;margin-top:12px;font-size:16px}
.night-setup-flow a{color:#eee6ff;text-decoration:underline}
#root h1{font-size:30px;white-space:normal}
.night-listening-instruction{font-size:clamp(28px,8vw,36px);line-height:1.15;font-weight:700;margin:0 0 12px}
.night-listening-support{font-size:16px;line-height:1.5;margin:0 0 20px;color:#d8ccff}
#root .night-stop{background:transparent;color:#eee6ff;border:1px solid #9883bb;font-size:16px;font-weight:400}
#root .night-player-status+div button span.uppercase{font-size:20px;letter-spacing:normal;text-transform:none;font-weight:700}

/* Keep Change and STOP independently reachable on phone widths. */
@media (max-width:420px) {
  .night-player-status {flex-wrap:wrap;gap:10px}
  .night-player-status > div {flex-basis:100%}
  .night-player-status > button {flex:1;min-width:0}
}

.night-required-file>summary{display:none}
