<!doctype html><html lang="en"><meta charset="utf-8"><title>Gentle Tapping · All nine contacts</title><style>*{box-sizing:border-box}body{margin:0;padding:30px;background:#122e34;color:#ece2d2;font-family:Arial,sans-serif}header{margin-bottom:25px}small{font-size:11px;letter-spacing:2px;color:#e2c08b}h1{font:400 38px/1.1 Georgia,serif;margin:12px 0}p{font-size:14px;line-height:1.5;color:#c1ccbf;max-width:1150px}.grid{display:grid;grid-template-columns:repeat(3,390px);gap:24px 20px;align-items:start}figure{margin:0}figcaption{font-size:13px;margin-bottom:12px;color:#e5d2ac}img{display:block;width:390px;border-radius:20px;border:1px solid #c9d3c530}.small .grid{grid-template-columns:repeat(3,320px)}.small img{width:320px}</style><header><small>MENTICATION / GENTLE TAPPING / ALL NINE CONTACTS</small><h1 id="title"></h1><p id="description"></p></header><div class="grid" id="grid"></div><script>const tap=new URLSearchParams(location.search).has('tap');const width=tap?320:390;const phase=tap?'tap':'place';if(tap)document.body.className='small';document.getElementById('title').textContent=tap?'A gentle rhythm. Room to stop.':'Two fingertips. One precise place.';document.getElementById('description').textContent=`Actual component screenshots at ${width} × ${tap?640:844} phone viewports, in protocol order. ${tap?'Rhythm starts after placement; the setup keeps its three reminder windows. Pause and Stop are visible in every screen.':'Each marker shares the photograph’s source coordinates. Descriptions follow EFT International’s standard short sequence; either side is fine.'} These are seeded review states, not measured outcomes. Screens are full-page captures.`;const points=[['hand','Setup · Side of hand'],['crown','01 · Top of head'],['brow','02 · Inner eyebrow'],['sideEye','03 · Side of eye'],['underEye','04 · Under eye'],['nose','05 · Under nose'],['chin','06 · Chin crease'],['collar','07 · Below collarbone'],['arm','08 · Under arm']];document.getElementById('grid').innerHTML=points.map(([id,label])=>`<figure><figcaption>${label}</figcaption><img src="screenshots/${id}-${phase}-${width}.png"></figure>`).join('');</script></html>
