services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      # Vite >= 6.1 appends this to its allowed hosts list so the preview
      # proxy hostname is accepted. The platform sets this value.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 5173"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  node_modules:
